name: Backend CI/CD (No Artifact)

on:
  push:
    branches:
      - main

env:
  PROJECT_NAME: EV_Dealer_Management_System
  DOTNET_VERSION: 9.0.x
  EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
  EC2_HOST: ${{ secrets.EC2_HOST_PUBLIC }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  build-and-deploy:
    name: Build and Deploy ASP.NET Core
    runs-on: ubuntu-latest
    environment: SWP391

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Publish project (framework-dependent)
        run: dotnet publish -c Release -o ./publish

      - name: Zip publish folder
        run: zip -r publish.zip ./publish

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ env.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload & deploy to EC2
        run: |
          set -euo pipefail

          test -f ./publish.zip || { echo "publish.zip not found in $(pwd)"; ls -lah; exit 1; }

          HOST="${{ secrets.EC2_HOST_PUBLIC }}"; USER="${{ secrets.EC2_USER }}"
          [ -n "$HOST" ] && [ -n "$USER" ] || { echo "Missing EC2_HOST_PUBLIC/EC2_USER"; exit 1; }

          scp ./publish.zip "$USER@$HOST:/home/$USER/"

          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "set -euo pipefail
            PROJECT='EV_Dealer_Management_System'
            DEPLOY_DIR='/var/www/'\"\$PROJECT\"
            SERVICE='kestrel-'\"\$PROJECT\"'.service'

          sudo systemctl cat \"\$SERVICE\" >/dev/null 2>&1 || exit 5

          (sudo dnf -y install p7zip p7zip-plugins >/dev/null 2>&1 \
            || sudo yum -y install p7zip p7zip-plugins >/dev/null 2>&1 \
            || (sudo apt-get update >/dev/null 2>&1 && sudo apt-get install -y p7zip-full >/dev/null 2>&1) || true)
          (sudo dnf -y install unzip >/dev/null 2>&1 || sudo yum -y install unzip >/dev/null 2>&1 || true)

          rm -rf ~/deploy_temp && mkdir -p ~/deploy_temp
          if ! 7z x -y ~/publish.zip -o~/deploy_temp >/dev/null 2>&1; then
            UNZIP_DISABLE_ZIPBOMB_DETECTION=TRUE unzip -o ~/publish.zip -d ~/deploy_temp >/dev/null
          fi

          sudo mkdir -p \"\$DEPLOY_DIR\"
          sudo systemctl stop \"\$SERVICE\" || true
          sudo rm -rf \"\${DEPLOY_DIR:?}\"/*
          sudo cp -r ~/deploy_temp/* \"\$DEPLOY_DIR\"/
          sudo chown -R ec2-user:ec2-user \"\$DEPLOY_DIR\"
          sudo systemctl daemon-reload
          sudo systemctl start \"\$SERVICE\"

          rm -rf ~/deploy_temp ~/publish.zip
          "

