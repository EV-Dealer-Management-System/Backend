name: Backend CI/CD (No Artifact)

on:
  push:
    branches: [ main ]

env:
  PROJECT_NAME: EV_Dealer_Management_System
  DOTNET_VERSION: 9.0.x
  EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
  EC2_HOST: ${{ secrets.EC2_HOST_PUBLIC }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: SWP391

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Publish project (framework-dependent)
        run: dotnet publish -c Release -o ./publish

      - name: Pack publish folder (tar.gz) + checksum
        run: |
          tar -C ./publish -czf publish.tgz .
          sha256sum publish.tgz > publish.tgz.sha256

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ env.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload & deploy to EC2
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.EC2_HOST_PUBLIC }}"
          USER="${{ secrets.EC2_USER }}"
          [ -n "$HOST" ] && [ -n "$USER" ] || { echo "Thiếu EC2_HOST_PUBLIC/EC2_USER"; exit 1; }

          scp publish.tgz publish.tgz.sha256 "$USER@$HOST:/home/$USER/"

          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "set -euo pipefail

          PROJECT='${{ env.PROJECT_NAME }}'
          DEPLOY_DIR='/var/www/'\"\$PROJECT\"
          SERVICE='kestrel-'\"\$PROJECT\"'.service'

          if ! sudo systemctl list-unit-files | grep -q \"\$SERVICE\"; then
            echo 'Service '\$SERVICE' chưa tồn tại trên host này.'
            echo '>> Kiểm tra đúng máy EC2 đã tạo service chưa (/etc/systemd/system/'\$SERVICE')'
            exit 5
          fi
          command -v tar >/dev/null 2>&1 || sudo dnf -y install tar || sudo yum -y install tar || true

          cd /home/$USER
          sha256sum -c publish.tgz.sha256
          rm -rf deploy_temp && mkdir -p deploy_temp
          tar -xzf publish.tgz -C deploy_temp

          sudo systemctl stop \"\$SERVICE\" || true
          sudo mkdir -p \"\$DEPLOY_DIR\"
          sudo rm -rf \"\${DEPLOY_DIR:?}\"/*
          sudo cp -r deploy_temp/* \"\$DEPLOY_DIR\"/
          sudo chown -R $USER:$USER \"\$DEPLOY_DIR\"
          sudo systemctl daemon-reload
          sudo systemctl start \"\$SERVICE\"

          # Cleanup
          rm -rf deploy_temp publish.tgz publish.tgz.sha256
          "
